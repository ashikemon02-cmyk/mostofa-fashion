    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var activeFetch = nativeFetch ? nativeFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            var activeProtoFetch = protoFetch ? protoFetch.bind(window) : undefined;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return activeProtoFetch;
              },
              set: function(fn) {
                activeProtoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
